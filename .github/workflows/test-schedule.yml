name: Test scheduled Node.js script

on:
  schedule:
    # GitHub Actions 支持的最短间隔是 5 分钟；从第 2 分钟开始以避开整点高峰。
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: workflow-schedule-test
  cancel-in-progress: false

jobs:
  write-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Prepare test branch
        env:
          TEST_BRANCH: automation/workflow-schedule-test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin "$TEST_BRANCH"; then
            git checkout -B "$TEST_BRANCH" "origin/$TEST_BRANCH"
          else
            git checkout -b "$TEST_BRANCH"
          fi

      - name: Run Node.js test script
        run: node scripts/write-workflow-test-log.mjs

      - name: Commit test log
        env:
          TEST_BRANCH: automation/workflow-schedule-test
        run: |
          git add public/workflow-schedule-test.txt
          git commit -m "chore(ci): 记录定时工作流运行"
          git push --set-upstream origin "$TEST_BRANCH"

      - name: Create test pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_BRANCH: automation/workflow-schedule-test
        run: |
          pr_number="$(gh pr list --state open --head "$TEST_BRANCH" --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base master \
              --head "$TEST_BRANCH" \
              --title "chore(ci): 测试定时工作流" \
              --body "该 PR 由测试工作流自动维护，用于确认 GitHub Actions 的 schedule 触发是否正常。"
          else
            echo "Updated existing pull request #$pr_number"
          fi
