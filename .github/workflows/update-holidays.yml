name: Check next-year holidays

on:
  schedule:
    # 北京时间每天 09:23，在通知最可能发布的 9 月至次年 1 月运行。
    - cron: "23 1 * 1,9-12 *"
  workflow_dispatch:
    inputs:
      year:
        description: "目标年份；留空时使用 data 中最新年份加一"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: holiday-data-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Log trigger diagnostics
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          utc_time="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          beijing_time="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          schedule="${EVENT_SCHEDULE:-manual}"

          echo "event=$EVENT_NAME"
          echo "schedule=$schedule"
          echo "run_id=$RUN_ID"
          echo "ref=$REF_NAME"
          echo "sha=$COMMIT_SHA"
          echo "utc_time=$utc_time"
          echo "beijing_time=$beijing_time"

          {
            echo "## Trigger diagnostics"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$EVENT_NAME\` |"
            echo "| Schedule | \`$schedule\` |"
            echo "| Run ID | \`$RUN_ID\` |"
            echo "| Branch | \`$REF_NAME\` |"
            echo "| Commit | \`$COMMIT_SHA\` |"
            echo "| UTC time | \`$utc_time\` |"
            echo "| Beijing time | \`$beijing_time\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Search and parse official notice
        id: update
        continue-on-error: true
        env:
          TARGET_YEAR: ${{ inputs.year }}
        run: |
          set -o pipefail
          if [ -n "$TARGET_YEAR" ]; then
            node scripts/update-holidays.mjs --year "$TARGET_YEAR" 2>&1 | tee update.log
          else
            node scripts/update-holidays.mjs 2>&1 | tee update.log
          fi
      - name: Report parser or network failure
        if: steps.update.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="节假日自动更新失败"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file update.log
          else
            gh issue create --title "$title" --body-file update.log
          fi
          exit 1
      - name: Build and test candidate
        if: steps.update.outputs.found == 'true'
        run: npm run build
      - name: Create or update draft pull request
        if: steps.update.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ steps.update.outputs.year }}
          SOURCE: ${{ steps.update.outputs.source }}
        run: |
          branch="automation/holidays-$YEAR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "data/$YEAR.json" public/*.ics
          git commit -m "Add $YEAR China holiday schedule"
          git push --force-with-lease --set-upstream origin "$branch"

          pr_number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --draft \
              --base master \
              --head "$branch" \
              --title "添加 $YEAR 年中国节假日安排" \
              --body "数据由自动化程序从国务院办公厅正式通知解析。合并前请人工逐项核对。\n\n官方来源：$SOURCE\n\n自动校验和 ICS 测试已通过。"
          fi
